<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сервис валют</title>
</head>
<body>
<h1 style="text-align:center;">Сервис валют</h1>

<button id="loadCurrenciesBtn">Валюты</button>

<select id="currencySelect" style="display:none; margin-top:10px;">
  <option value="">Выберите валюту</option>
</select>

<div id="currencyInfo" style="margin-top:15px; padding:10px; border:1px solid #000; display:none;">
  <span id="currencyName"></span>: <span id="currencyRate"></span>
</div>

<script>
  document.getElementById('loadCurrenciesBtn').onclick = function() {
    fetch('/api/currency-rates/today')
            .then(response => response.json())
            .then(data => {
              const currencySelect = document.getElementById('currencySelect');
              currencySelect.innerHTML = '<option value="">Выберите валюту</option>';

              data.forEach(item => {
                const option = document.createElement('option');
                option.value = item.rate;
                option.textContent = item.currency.code + ' (' + item.currency.name + ')';
                option.setAttribute('data-name', item.currency.name);
                currencySelect.appendChild(option);
              });

              currencySelect.style.display = 'block';
              document.getElementById('currencyInfo').style.display = 'none';
            })
            .catch(err => console.log('Ошибка:', err));
  };

  document.getElementById('currencySelect').onchange = function() {
    const selectedOption = this.options[this.selectedIndex];
    const name = selectedOption.getAttribute('data-name');
    const rate = selectedOption.value;

    if (name && rate) {
      document.getElementById('currencyName').textContent = name;
      document.getElementById('currencyRate').textContent = rate;
      document.getElementById('currencyInfo').style.display = 'block';
    } else {
      document.getElementById('currencyInfo').style.display = 'none';
    }
  };
</script>
</body>
</html>
